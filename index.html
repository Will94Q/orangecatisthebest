<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOK☆WALKER 優惠計算機 v3</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="BOOK☆WALKER 優惠計算機">
<meta name="theme-color" content="#0b6fb8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bw-blue:#0b6fb8;--bw-dark:#0a4d7a;--bw-light:#e8f3fb;
    --bw-accent:#f5a623;--border:#cdd9e3;--ink:#1f2d3a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Helvetica Neue",Arial,sans-serif;
    background:#f3f6f9;color:var(--ink);}
  header{background:linear-gradient(135deg,var(--bw-blue),var(--bw-dark));color:#fff;padding:22px 28px;}
  header h1{margin:0;font-size:22px;letter-spacing:1px;}
  header .ver{display:inline-block;background:var(--bw-accent);color:#3a2b00;font-size:12px;
    font-weight:700;border-radius:4px;padding:1px 7px;margin-left:8px;vertical-align:3px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.85;}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 24px 60px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{margin:0 0 14px;font-size:16px;color:var(--bw-dark);
    border-left:4px solid var(--bw-accent);padding-left:10px;}
  .row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:#5a6b7a;font-weight:600;}
  .field input{width:130px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:14px;}
  .field input:focus{outline:none;border-color:var(--bw-blue);box-shadow:0 0 0 2px var(--bw-light);}
  .field input.txt{width:160px;}
  .field input.small{width:80px;}
  .group-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;background:#fbfdff;}
  .group-card .ghead{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:12px;}
  table.cols{border-collapse:collapse;width:100%;}
  table.cols th,table.cols td{border:1px solid var(--border);padding:5px 6px;text-align:center;font-size:13px;}
  table.cols th{background:var(--bw-light);color:var(--bw-dark);font-weight:600;}
  table.cols td input{width:84px;padding:5px;border:1px solid var(--border);border-radius:5px;
    font-size:13px;text-align:right;}
  table.cols td input:focus{outline:none;border-color:var(--bw-blue);}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  button{cursor:pointer;border:none;border-radius:7px;font-size:14px;font-weight:600;
    padding:10px 22px;transition:.15s;}
  .btn-primary{background:var(--bw-blue);color:#fff;}
  .btn-primary:hover{background:var(--bw-dark);}
  .btn-accent{background:var(--bw-accent);color:#3a2b00;}
  .btn-accent:hover{filter:brightness(.95);}
  .btn-ghost{background:#eef2f6;color:var(--ink);}
  .btn-ghost:hover{background:#e2e8ee;}
  .btn-mini{padding:5px 12px;font-size:12px;background:#eef2f6;color:var(--ink);}
  .btn-mini:hover{background:#e2e8ee;}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5a6b7a;}
  /* output table */
  #outWrap{overflow-x:auto;}
  table.calc{border-collapse:collapse;font-size:13px;white-space:nowrap;}
  table.calc th,table.calc td{border:1px solid #b9c6d2;padding:5px 9px;text-align:right;}
  table.calc .lbl{text-align:left;background:#f1f5f9;font-weight:600;position:sticky;left:0;}
  table.calc .vbadge{display:inline-block;background:var(--bw-accent);color:#3a2b00;font-size:10px;
    border-radius:3px;padding:0 4px;margin-right:5px;font-weight:700;vertical-align:1px;}
  table.calc .grphead{background:var(--bw-blue);color:#fff;text-align:center;font-weight:700;}
  table.calc .colhead{background:var(--bw-light);color:var(--bw-dark);text-align:center;}
  table.calc .calc-cell{background:#fff;}
  table.calc .input-cell{background:#fff8ec;}
  table.calc .span-cell{background:#eef6fc;text-align:center;}
  table.calc tr.section td{background:#fff;border:none;height:8px;padding:0;}
  table.calc .ok{color:#1b8a3a;font-weight:700;}
  table.calc .bad{color:#c0392b;font-weight:700;}
  table.calc .total td{background:#fff3d6;font-weight:700;}
  .hint{font-size:12px;color:#7a8a98;margin-top:8px;}
  .empty-note{color:#7a8a98;font-size:14px;padding:10px 0;}
</style>
</head>
<body>
<header>
  <h1>BOOK☆WALKER 優惠計算機<span class="ver">v3</span></h1>
  <p>v3 更新：拆分「優惠券折抵(折數)/(定額)」、空白欄自動套用預設值、僅顯示有輸入值的運算列。</p>
</header>

<div class="wrap">

  <!-- 設定 -->
  <div class="card">
    <h2>① 表格設定</h2>
    <div class="row">
      <div class="field">
        <label>點數倍送組數</label>
        <input type="number" id="groupCount" class="small" min="1" max="12" value="1">
      </div>
      <button class="btn-ghost" onclick="buildForm()">套用設定 / 重建表單</button>
      <label class="toggle">
        <input type="checkbox" id="showAll"> 顯示完整計算表（包含預設值列）
      </label>
    </div>
    <div class="hint">勾選「顯示完整計算表」可看到所有列；不勾選時只顯示有實際輸入值的運算部分。</div>
  </div>

  <!-- 全域變數 -->
  <div class="card">
    <h2>② 全域變數（V）</h2>
    <div class="row" id="globalVars"></div>
  </div>

  <!-- 各組變數 -->
  <div class="card">
    <h2>③ 各組變數（V）</h2>
    <div id="groups"></div>
  </div>

  <!-- 動作 -->
  <div class="card">
    <h2>④ 產出</h2>
    <div class="btnrow">
      <button class="btn-primary" onclick="generate()">產出計算表</button>
      <button class="btn-accent" id="dlBtn" onclick="downloadExcel()" style="display:none;">下載 Excel</button>
      <button class="btn-ghost" onclick="window.print()">列印</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="card">
    <h2>⑤ 計算表</h2>
    <div id="outWrap"><div class="empty-note">尚未產出，請填妥變數後按「產出計算表」。</div></div>
  </div>

</div>

<script>
/* ============ 變數定義（含預設值） ============ */
const GLOBAL_VARS=[
  {id:'couponThreshold',label:'優惠券滿額',     def:0},
  {id:'thresholdFixed', label:'滿額折扣(定額)', def:0},
  {id:'thresholdStd',   label:'滿額標準',       def:0},
  {id:'pointsUsed',     label:'使用點數',       def:0},
  {id:'pointsBonus',    label:'點數滿額加贈',   def:0},
  {id:'originalPoints', label:'原點數',         def:0},
];
const GROUP_VARS=[
  {id:'couponDiscount',     label:'優惠券折抵(折數)', def:1},
  {id:'couponDiscountFixed',label:'優惠券折抵(定額)', def:0},
  {id:'thresholdRate',      label:'滿額折扣(折數)',   def:1},
  {id:'pointsMul',          label:'點數倍送',         def:1},
  {id:'gainAdjust',         label:'可獲得調整',       def:0},
];
const CELL_VARS=[
  {id:'price',label:'原價',def:0},
  {id:'rate', label:'折數',def:1},
  {id:'qty',  label:'本數',def:0},
];

/* ============ 工具 ============ */
function eround(x,d){if(!isFinite(x))return 0;const m=Math.pow(10,d||0);
  return (x<0?-1:1)*Math.round(Math.abs(x)*m)/m;}
function $(id){return document.getElementById(id);}
function readField(id,def){
  const el=$(id); if(!el) return {value:def,filled:false};
  const raw=String(el.value).trim();
  if(raw==='') return {value:def,filled:false};
  const n=parseFloat(raw);
  if(!isFinite(n)) return {value:def,filled:false};
  return {value:n,filled:true};
}

/* ============ 建立表單 ============ */
function buildForm(){
  const gv=$('globalVars'); gv.innerHTML='';
  GLOBAL_VARS.forEach(v=>{
    const old=$('gv_'+v.id)?$('gv_'+v.id).value:'';
    const f=document.createElement('div');f.className='field';
    f.innerHTML='<label>'+v.label+'</label>'+
      '<input type="number" step="any" id="gv_'+v.id+'" placeholder="空白='+v.def+'">';
    gv.appendChild(f);
    if(old!=='') f.querySelector('input').value=old;
  });
  const n=Math.max(1,Math.min(12,parseInt($('groupCount').value)||1));
  $('groupCount').value=n;
  const host=$('groups');
  const prev={};
  document.querySelectorAll('#groups input').forEach(i=>prev[i.id]=i.value);
  host.innerHTML='';
  for(let g=0;g<n;g++){
    const prevCols=prev['colcount_'+g]?parseInt(prev['colcount_'+g]):1;
    const cols=Math.max(1,Math.min(20,prevCols||1));
    const card=document.createElement('div');card.className='group-card';
    let gv2='';
    GROUP_VARS.forEach(v=>{
      gv2+='<div class="field"><label>'+v.label+'</label>'+
        '<input type="number" step="any" id="g'+g+'_'+v.id+'" placeholder="空白='+v.def+'"></div>';
    });
    card.innerHTML=
      '<div class="ghead">'+
        '<div class="field"><label>組別名稱</label>'+
          '<input type="text" class="txt" id="gname_'+g+'" value="點數倍送'+(g+1)+'."></div>'+
        '<div class="field"><label>書籍欄位數</label>'+
          '<input type="number" class="small" min="1" max="20" id="colcount_'+g+'" value="'+cols+'"></div>'+
        '<button class="btn-mini" onclick="rebuildCols('+g+')">套用欄位數</button>'+
        gv2+
      '</div>'+
      '<div id="coltbl_'+g+'"></div>';
    host.appendChild(card);
    GROUP_VARS.forEach(v=>{const k='g'+g+'_'+v.id;if(prev[k]!==undefined)$(k).value=prev[k];});
    if(prev['gname_'+g]!==undefined)$('gname_'+g).value=prev['gname_'+g];
    rebuildCols(g,prev);
  }
}

function rebuildCols(g,prev){
  prev=prev||{};
  document.querySelectorAll('#coltbl_'+g+' input').forEach(i=>{if(prev[i.id]===undefined)prev[i.id]=i.value;});
  const cols=Math.max(1,Math.min(20,parseInt($('colcount_'+g).value)||1));
  $('colcount_'+g).value=cols;
  let head='<tr><th>項目</th>';
  for(let c=0;c<cols;c++)head+='<th>書'+(c+1)+'</th>';
  head+='</tr>';
  let body='';
  CELL_VARS.forEach(v=>{
    body+='<tr><th>'+v.label+'<br><span style="font-weight:400;color:#94a3b1;font-size:11px;">空白='+v.def+'</span></th>';
    for(let c=0;c<cols;c++){
      const id='g'+g+'c'+c+'_'+v.id;
      const val=prev[id]!==undefined?prev[id]:'';
      body+='<td><input type="number" step="any" id="'+id+'" value="'+val+'" placeholder="'+v.def+'"></td>';
    }
    body+='</tr>';
  });
  $('coltbl_'+g).innerHTML='<table class="cols"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}

/* ============ 讀取輸入（含 filled 旗標） ============ */
function readModel(){
  const n=parseInt($('groupCount').value)||1;
  const m={global:{},globalFilled:{},groups:[]};
  GLOBAL_VARS.forEach(v=>{
    const r=readField('gv_'+v.id,v.def);
    m.global[v.id]=r.value; m.globalFilled[v.id]=r.filled;
  });
  for(let g=0;g<n;g++){
    const cols=parseInt($('colcount_'+g).value)||1;
    const gObj={name:$('gname_'+g).value||('組'+(g+1)),cols,vars:{},varsFilled:{},cells:[],cellsFilled:[]};
    GROUP_VARS.forEach(v=>{
      const r=readField('g'+g+'_'+v.id,v.def);
      gObj.vars[v.id]=r.value; gObj.varsFilled[v.id]=r.filled;
    });
    for(let c=0;c<cols;c++){
      const cell={},cf={};
      CELL_VARS.forEach(v=>{
        const r=readField('g'+g+'c'+c+'_'+v.id,v.def);
        cell[v.id]=r.value; cf[v.id]=r.filled;
      });
      gObj.cells.push(cell); gObj.cellsFilled.push(cf);
    }
    m.groups.push(gObj);
  }
  return m;
}

/* ============ 計算（對應 xlsx 公式） ============ */
function compute(m){
  const G=m.global, R={groups:[]};
  let grandTotal=0, origTotalAll=0;
  m.groups.forEach(gr=>{
    const gR={cells:[],totalSum:0,origSum:0};
    gr.cells.forEach(cell=>{
      const after2=cell.price*cell.rate;
      const after =eround(after2,0);
      const total =after*cell.qty;
      const origTotal=cell.price*cell.qty;
      gR.cells.push({after2,after,total,origTotal});
      gR.totalSum+=total; gR.origSum+=origTotal;
    });
    grandTotal+=gR.totalSum; origTotalAll+=gR.origSum;
    R.groups.push(gR);
  });
  R.grandTotal=grandTotal; R.origTotalAll=origTotalAll;
  R.check1 = grandTotal>=G.couponThreshold ? '滿'+G.couponThreshold : '無法使用優惠券';
  // 折畢 = ROUND(總價合計*優惠券折抵折數 - 優惠券折抵定額, 0)
  let discountedSum=0;
  m.groups.forEach((gr,i)=>{
    R.groups[i].discounted=eround(R.groups[i].totalSum*gr.vars.couponDiscount - gr.vars.couponDiscountFixed,0);
    discountedSum+=R.groups[i].discounted;
  });
  R.discountedSum=discountedSum;
  R.check2 = discountedSum>=G.thresholdStd ? '滿'+G.thresholdStd : '未滿額';
  let thDiscSum=0;
  m.groups.forEach((gr,i)=>{
    R.groups[i].thDisc=R.groups[i].discounted*gr.vars.thresholdRate;
    thDiscSum+=R.groups[i].thDisc;
  });
  R.discountedSum2=eround(thDiscSum-G.thresholdFixed,0);
  m.groups.forEach((gr,i)=>{
    const td=R.groups[i].thDisc;
    R.groups[i].actualPay = R.discountedSum2!==0
      ? eround(td + G.pointsUsed/R.discountedSum2*td,0)
      : eround(td,0);
  });
  R.useAndGet = R.discountedSum2 + G.pointsUsed;
  let pgs=0;
  m.groups.forEach((gr,i)=>{
    R.groups[i].pointsGain = R.groups[i].actualPay*0.01*gr.vars.pointsMul + gr.vars.gainAdjust;
    pgs+=R.groups[i].pointsGain;
  });
  R.pointsGainSum=pgs; R.pointsTotal=pgs+G.pointsBonus;
  m.groups.forEach((gr,i)=>{
    const gR=R.groups[i];
    gR.actualRate = gR.origSum!==0 ? (gR.thDisc-gR.pointsGain)/gR.origSum : 0;
  });
  R.totalRate = origTotalAll!==0 ? (R.discountedSum2-pgs)/origTotalAll : 0;
  R.useAndGet2 = G.pointsUsed + R.pointsTotal;
  R.remaining  = G.originalPoints + R.useAndGet2;
  return R;
}

/* ============ 旗標：哪些區段/列要顯示 ============ */
function computeFlags(m){
  const gf=m.globalFilled;
  const anyG=(key)=>m.groups.some(g=>g.varsFilled[key]);
  const anyC=(key)=>m.groups.some(g=>g.cellsFilled.some(c=>c[key]));
  const f={
    anyPrice : anyC('price'),
    anyRate  : anyC('rate'),
    anyQty   : anyC('qty'),
    couponThreshold:gf.couponThreshold,
    anyCouponRate :anyG('couponDiscount'),
    anyCouponFixed:anyG('couponDiscountFixed'),
    thresholdFixed:gf.thresholdFixed,
    anyThresholdRate:anyG('thresholdRate'),
    thresholdStd  :gf.thresholdStd,
    pointsUsed    :gf.pointsUsed,
    anyPointsMul  :anyG('pointsMul'),
    anyGainAdjust :anyG('gainAdjust'),
    pointsBonus   :gf.pointsBonus,
    originalPoints:gf.originalPoints,
  };
  f.anyCoupon = f.couponThreshold||f.anyCouponRate||f.anyCouponFixed;
  f.anyThreshold = f.thresholdFixed||f.anyThresholdRate||f.thresholdStd;
  f.anyPoints = f.pointsUsed||f.anyPointsMul||f.anyGainAdjust||f.pointsBonus;
  f.anyDiscount = f.anyRate||f.anyCoupon||f.anyThreshold||f.anyPoints;
  return f;
}

/* ============ 格式化 ============ */
function fInt(x){return Math.round(x*100)/100===Math.round(x)?String(Math.round(x)):(Math.round(x*100)/100).toString();}
function f2(x){return (Math.round(x*100)/100).toFixed(2);}
function fPct(x){return (x*100).toFixed(2)+'%';}
function fNum(x){const r=Math.round(x*1e6)/1e6;return String(r);}

/* ============ 計算表 ============ */
let LAST=null;

function generate(){
  const model=readModel();
  const result=compute(model);
  const flags=computeFlags(model);
  LAST={model,result,flags};
  renderTable(model,result,flags);
  $('dlBtn').style.display='inline-block';
}

function renderTable(m,R,F){
  const showAll=$('showAll').checked;
  const sv=(cond)=>showAll||cond; // shouldShow
  const totalCols=m.groups.reduce((s,g)=>s+g.cols,0);
  let html='<table class="calc">';
  // 表頭
  html+='<tr><th class="lbl">項目</th>';
  m.groups.forEach(g=>{
    html+='<th class="grphead" colspan="'+g.cols+'">'+esc(g.name)+'</th>';
  });
  html+='</tr><tr><th class="lbl"></th>';
  m.groups.forEach(g=>{for(let c=0;c<g.cols;c++)html+='<th class="colhead">書'+(c+1)+'</th>';});
  html+='</tr>';

  const rowsBuf=[];
  function rowPerCol(show,label,isV,getter,fmt,cls){
    if(!show)return;
    let r='<tr'+(cls?' class="'+cls+'"':'')+'><td class="lbl">'+(isV?'<span class="vbadge">V</span>':'')+label+'</td>';
    m.groups.forEach((g,gi)=>{
      g.cells.forEach((cell,ci)=>{
        r+='<td class="'+(isV?'input-cell':'calc-cell')+'">'+fmt(getter(gi,ci))+'</td>';
      });
    });
    rowsBuf.push(r+'</tr>');
  }
  function rowPerGroup(show,label,isV,getter,fmt,cls){
    if(!show)return;
    let r='<tr'+(cls?' class="'+cls+'"':'')+'><td class="lbl">'+(isV?'<span class="vbadge">V</span>':'')+label+'</td>';
    m.groups.forEach((g,gi)=>{
      r+='<td class="'+(isV?'input-cell':'calc-cell')+' span-cell" colspan="'+g.cols+'">'+fmt(getter(gi))+'</td>';
    });
    rowsBuf.push(r+'</tr>');
  }
  function rowGlobal(show,label,isV,value,fmt,cls){
    if(!show)return;
    rowsBuf.push('<tr'+(cls?' class="'+cls+'"':'')+'><td class="lbl">'+(isV?'<span class="vbadge">V</span>':'')+label+
      '</td><td class="'+(isV?'input-cell':'calc-cell')+' span-cell" colspan="'+totalCols+'">'+fmt(value)+'</td></tr>');
  }
  function section(){rowsBuf.push('SECTION');}

  // === 區塊一：總價 ===
  rowPerCol(true,'原價',true,(g,c)=>m.groups[g].cells[c].price,fInt);
  rowPerCol(sv(F.anyRate),'折數',true,(g,c)=>m.groups[g].cells[c].rate,fNum);
  rowPerCol(sv(F.anyRate),'折扣後(2位)',false,(g,c)=>R.groups[g].cells[c].after2,f2);
  rowPerCol(sv(F.anyRate),'折扣後',false,(g,c)=>R.groups[g].cells[c].after,fInt);
  rowPerCol(true,'本數',true,(g,c)=>m.groups[g].cells[c].qty,fInt);
  rowPerCol(true,'總價',false,(g,c)=>R.groups[g].cells[c].total,fInt);
  rowPerGroup(true,'總價合計',false,g=>R.groups[g].totalSum,fInt);
  rowGlobal(m.groups.length>1||showAll,'加總',false,R.grandTotal,fInt,'total');
  section();

  // === 區塊二：優惠券 ===
  rowGlobal(sv(F.couponThreshold),'優惠券滿額',true,m.global.couponThreshold,fInt);
  rowGlobal(sv(F.couponThreshold),'check',false,R.check1,checkFmt);
  rowPerGroup(sv(F.anyCouponRate),'優惠券折抵(折數)',true,g=>m.groups[g].vars.couponDiscount,fNum);
  rowPerGroup(sv(F.anyCouponFixed),'優惠券折抵(定額)',true,g=>m.groups[g].vars.couponDiscountFixed,fInt);
  rowPerGroup(sv(F.anyCoupon),'折畢',false,g=>R.groups[g].discounted,fInt);
  rowGlobal(sv(F.anyCoupon && m.groups.length>1),'折畢合計',false,R.discountedSum,fInt);
  section();

  // === 區塊三：滿額 / 折畢 ===
  rowGlobal(sv(F.thresholdFixed),'滿額折扣(定額)',true,m.global.thresholdFixed,fInt);
  rowPerGroup(sv(F.anyThresholdRate),'滿額折扣(折數)',true,g=>m.groups[g].vars.thresholdRate,fNum);
  rowGlobal(sv(F.thresholdStd),'滿額標準',true,m.global.thresholdStd,fInt);
  rowGlobal(sv(F.thresholdStd),'check',false,R.check2,checkFmt);
  rowPerGroup(sv(F.anyThresholdRate||F.thresholdFixed),'滿額折畢',false,g=>R.groups[g].thDisc,f2);
  rowGlobal(sv(F.anyThreshold||F.anyCoupon),'折畢合計',false,R.discountedSum2,fInt,'total');
  rowGlobal(sv(F.pointsUsed),'使用點數',true,m.global.pointsUsed,fInt);
  rowPerGroup(sv(F.pointsUsed),'實際支付',false,g=>R.groups[g].actualPay,fInt);
  rowGlobal(sv(F.pointsUsed),'本次使用&獲得',false,R.useAndGet,fInt);
  section();

  // === 區塊四：點數 ===
  rowPerGroup(sv(F.anyPointsMul),'點數倍送',true,g=>m.groups[g].vars.pointsMul,fNum);
  rowPerGroup(sv(F.anyGainAdjust),'可獲得調整',true,g=>m.groups[g].vars.gainAdjust,fNum);
  rowPerGroup(sv(F.anyPointsMul||F.anyGainAdjust),'可獲得',false,g=>R.groups[g].pointsGain,f2);
  rowGlobal(sv(F.pointsBonus),'點數滿額加贈',true,m.global.pointsBonus,fNum);
  rowGlobal(sv(F.anyPointsMul||F.anyGainAdjust||F.pointsBonus),'點數合計',false,R.pointsTotal,f2,'total');
  section();

  // === 區塊五：折數分析 ===
  rowPerCol(sv(F.anyDiscount),'原總價',false,(g,c)=>R.groups[g].cells[c].origTotal,fInt);
  rowGlobal(sv(F.anyDiscount && m.groups.length>1),'加總',false,R.origTotalAll,fInt);
  rowPerGroup(sv(F.anyDiscount),'實際折數',false,g=>R.groups[g].actualRate,fPct);
  rowGlobal(sv(F.anyDiscount),'合計折數',false,R.totalRate,fPct);
  section();

  // === 區塊六：點數收支 ===
  rowGlobal(sv(F.originalPoints),'原點數',true,m.global.originalPoints,fNum);
  rowGlobal(sv(F.originalPoints||F.anyPoints),'本次使用&獲得',false,R.useAndGet2,f2);
  rowGlobal(sv(F.originalPoints),'剩餘點數',false,R.remaining,f2,'total');

  // 處理 SECTION 分隔：去掉空段、合併連續
  const cleaned=[];
  let lastWasSection=true; // 開頭不要 section
  rowsBuf.forEach(r=>{
    if(r==='SECTION'){
      if(!lastWasSection) cleaned.push('<tr class="section"><td colspan="'+(totalCols+1)+'"></td></tr>');
      lastWasSection=true;
    }else{cleaned.push(r);lastWasSection=false;}
  });
  // 去除尾段 section
  while(cleaned.length && cleaned[cleaned.length-1].indexOf('section')>=0 && cleaned[cleaned.length-1].indexOf('class="section"')>=0) cleaned.pop();

  html+=cleaned.join('');
  html+='</table>';
  html+='<div class="hint">標示 <span class="vbadge">V</span> 的列為輸入變數；橘底為輸入值，白底為計算值。'+
        '空白欄已自動套用預設值，預設值列已隱藏（勾選「顯示完整計算表」可顯示全部）。</div>';
  $('outWrap').innerHTML=html;
}
function checkFmt(v){
  const ok=!(v==='無法使用優惠券'||v==='未滿額');
  return '<span class="'+(ok?'ok':'bad')+'">'+esc(v)+'</span>';
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ============ Excel 下載（套用相同隱藏邏輯） ============ */
function downloadExcel(){
  if(!LAST){alert('請先產出計算表');return;}
  const m=LAST.model,R=LAST.result,F=LAST.flags;
  const showAll=$('showAll').checked;
  const sv=(cond)=>showAll||cond;
  const totalCols=m.groups.reduce((s,g)=>s+g.cols,0);
  const aoa=[];

  let h1=['項目'];m.groups.forEach(g=>{h1.push(g.name);for(let c=1;c<g.cols;c++)h1.push('');});
  aoa.push(h1);
  let h2=[''];m.groups.forEach(g=>{for(let c=0;c<g.cols;c++)h2.push('書'+(c+1));});
  aoa.push(h2);

  const buf=[];
  const perCol=(show,label,getter)=>{if(!show)return;const r=[label];m.groups.forEach((g,gi)=>g.cells.forEach((_,ci)=>r.push(round6(getter(gi,ci)))));buf.push(r);};
  const perGrp=(show,label,getter)=>{if(!show)return;const r=[label];m.groups.forEach((g,gi)=>{r.push(round6(getter(gi)));for(let c=1;c<g.cols;c++)r.push('');});buf.push(r);};
  const glob  =(show,label,value)=>{if(!show)return;const r=[label,value];for(let c=1;c<totalCols;c++)r.push('');buf.push(r);};
  const sec   =()=>buf.push('SEC');

  perCol(true,'原價',(g,c)=>m.groups[g].cells[c].price);
  perCol(sv(F.anyRate),'折數',(g,c)=>m.groups[g].cells[c].rate);
  perCol(sv(F.anyRate),'折扣後(2位)',(g,c)=>R.groups[g].cells[c].after2);
  perCol(sv(F.anyRate),'折扣後',(g,c)=>R.groups[g].cells[c].after);
  perCol(true,'本數',(g,c)=>m.groups[g].cells[c].qty);
  perCol(true,'總價',(g,c)=>R.groups[g].cells[c].total);
  perGrp(true,'總價合計',g=>R.groups[g].totalSum);
  glob(m.groups.length>1||showAll,'加總',round6(R.grandTotal));
  sec();

  glob(sv(F.couponThreshold),'優惠券滿額',m.global.couponThreshold);
  glob(sv(F.couponThreshold),'check',R.check1);
  perGrp(sv(F.anyCouponRate),'優惠券折抵(折數)',g=>m.groups[g].vars.couponDiscount);
  perGrp(sv(F.anyCouponFixed),'優惠券折抵(定額)',g=>m.groups[g].vars.couponDiscountFixed);
  perGrp(sv(F.anyCoupon),'折畢',g=>R.groups[g].discounted);
  glob(sv(F.anyCoupon && m.groups.length>1),'折畢合計',round6(R.discountedSum));
  sec();

  glob(sv(F.thresholdFixed),'滿額折扣(定額)',m.global.thresholdFixed);
  perGrp(sv(F.anyThresholdRate),'滿額折扣(折數)',g=>m.groups[g].vars.thresholdRate);
  glob(sv(F.thresholdStd),'滿額標準',m.global.thresholdStd);
  glob(sv(F.thresholdStd),'check',R.check2);
  perGrp(sv(F.anyThresholdRate||F.thresholdFixed),'滿額折畢',g=>R.groups[g].thDisc);
  glob(sv(F.anyThreshold||F.anyCoupon),'折畢合計',round6(R.discountedSum2));
  glob(sv(F.pointsUsed),'使用點數',m.global.pointsUsed);
  perGrp(sv(F.pointsUsed),'實際支付',g=>R.groups[g].actualPay);
  glob(sv(F.pointsUsed),'本次使用&獲得',round6(R.useAndGet));
  sec();

  perGrp(sv(F.anyPointsMul),'點數倍送',g=>m.groups[g].vars.pointsMul);
  perGrp(sv(F.anyGainAdjust),'可獲得調整',g=>m.groups[g].vars.gainAdjust);
  perGrp(sv(F.anyPointsMul||F.anyGainAdjust),'可獲得',g=>R.groups[g].pointsGain);
  glob(sv(F.pointsBonus),'點數滿額加贈',m.global.pointsBonus);
  glob(sv(F.anyPointsMul||F.anyGainAdjust||F.pointsBonus),'點數合計',round6(R.pointsTotal));
  sec();

  perCol(sv(F.anyDiscount),'原總價',(g,c)=>R.groups[g].cells[c].origTotal);
  glob(sv(F.anyDiscount && m.groups.length>1),'加總',round6(R.origTotalAll));
  perGrp(sv(F.anyDiscount),'實際折數',g=>R.groups[g].actualRate);
  glob(sv(F.anyDiscount),'合計折數',round6(R.totalRate));
  sec();

  glob(sv(F.originalPoints),'原點數',m.global.originalPoints);
  glob(sv(F.originalPoints||F.anyPoints),'本次使用&獲得',round6(R.useAndGet2));
  glob(sv(F.originalPoints),'剩餘點數',round6(R.remaining));

  // 清理 SEC 分隔
  let lastSec=true;
  buf.forEach(r=>{
    if(r==='SEC'){if(!lastSec)aoa.push([]);lastSec=true;}
    else{aoa.push(r);lastSec=false;}
  });
  while(aoa.length && Array.isArray(aoa[aoa.length-1]) && aoa[aoa.length-1].length===0) aoa.pop();

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=ws['!merges']||[];
  let col=1;
  m.groups.forEach(g=>{
    if(g.cols>1)ws['!merges'].push({s:{r:0,c:col},e:{r:0,c:col+g.cols-1}});
    col+=g.cols;
  });
  ws['!cols']=[{wch:16}].concat(Array(totalCols).fill({wch:11}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'BOOK☆WALKER優惠計算');
  XLSX.writeFile(wb,'BOOK☆WALKER計算表_v3.xlsx');
}
function round6(x){return typeof x==='number'?Math.round(x*1e6)/1e6:x;}

buildForm();
</script>
